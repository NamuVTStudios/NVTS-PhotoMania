# Publica apps/web en GitHub Pages en cada push a main.
# Requisito: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy NVTS Photomania to GitHub Pages

on:
  push:
    branches:
      - main # O la rama principal que uses (develop/main)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar y habilitar pnpm de forma nativa
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Instalar dependencias del monorrepo
        run: pnpm install --frozen-lockfile

      - name: Configurar Emscripten (SDK para Wasm)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Instalar dependencias del monorrepo
        run: pnpm install --frozen-lockfile

      - name: Compilar Motor C++ a WebAssembly
        run: |
          cd packages/engine
          chmod +x build.sh
          ./build.sh

      - name: Sincronizar assets de WebAssembly locales
        run: pnpm --filter @nvts-photomania/web run build:wasm || echo "No custom wasm script"

      - name: Pre-compilar paquetes dependientes del monorrepo
        run: |
          pnpm --filter @nvts-photomania/wasm-bindings build || echo "No build step required"
          pnpm --filter @nvts/document-model build || echo "No build step required"

      - name: Compilar Aplicación Frontend Definitiva (Vite)
        run: pnpm --filter @nvts-photomania/web build

      - name: Configurar Entorno de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir Artifact de Producción
        uses: actions/upload-pages-artifact@v3
        with:
          # Usamos la ruta absoluta integrada al workspace
          path: '${{ github.workspace }}/apps/web/dist'

      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4