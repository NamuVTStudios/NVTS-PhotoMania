# Publica apps/web en GitHub Pages en cada push a main.
# Requisito: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy NVTS Photomania to GitHub Pages

on:
  push:
    branches:
      - main # O la rama principal que uses (develop/main)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Configurar Emscripten (SDK para Wasm)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Instalar dependencias del monorrepo
        run: pnpm install --frozen-lockfile

      - name: Compilar Motor C++ a WebAssembly
        run: |
          cd packages/engine
          chmod +x build.sh
          ./build.sh

      - name: Compilar Aplicación Frontend (Vite)
        run: pnpm --filter @nvts-photomania/web build

      - name: Configurar Entorno de GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir Artifact de Producción
        uses: actions/upload-pages-artifact@v3
        with:
          # Apunta a la carpeta de salida que configuramos en tu vite.config.ts
          path: './dist/apps/web'

      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4
