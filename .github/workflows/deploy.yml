# Publica apps/web en GitHub Pages en cada push a main.
# Requisito: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy NVTS Photomania to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Habilitar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate

      - name: Instalar dependencias del monorrepo
        run: pnpm install --frozen-lockfile

      - name: Configurar Emscripten (SDK para Wasm)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Compilar motor C++ a WebAssembly y copiar assets
        run: pnpm build:wasm

      - name: Compilar aplicación frontend (Vite)
        run: pnpm --filter @nvts/web build

      - name: Verificar carpeta de salida
        run: |
          test -d apps/web/dist
          test -f apps/web/dist/index.html
          ls -la apps/web/dist

      - name: Configurar Entorno de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir Artifact de Producción
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4
